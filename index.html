<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>pomodoro-mon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23f5f5f5' stroke='%23222' stroke-width='4'/%3E%3Cpath d='M2 50h96' stroke='%23222' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23222'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23fff'/%3E%3Cpath d='M2 50 A48 48 0 0 1 98 50' fill='%23ef5350'/%3E%3C/svg%3E">
<style>
  :root { --bg:#1a1a2e; --panel:#16213e; --accent:#0f3460; --pop:#e94560; --txt:#eee; --muted:#889; }
  * { box-sizing:border-box; margin:0; padding:0; }
  /* ponytail: attribute hidden must beat any display rule (e.g. #viewer's display:flex) */
  [hidden] { display:none !important; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:1rem; }
  h1 { font-size:1.4rem; margin-bottom:1rem; letter-spacing:.5px; }
  h1 span { color:var(--pop); }
  .card { background:var(--panel); border-radius:12px; padding:1.25rem; width:100%; max-width:420px; margin-bottom:1rem; }
  #timer { font-size:3.5rem; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; }
  #mode { text-align:center; color:var(--muted); margin-bottom:1rem; text-transform:uppercase; letter-spacing:2px; font-size:.8rem; }
  .controls { display:flex; gap:.5rem; justify-content:center; }
  .subcontrols { display:flex; gap:.5rem; justify-content:center; margin-top:.6rem; flex-wrap:wrap; }
  .subcontrols button { font-size:.8rem; background:transparent; color:var(--muted); border:1px solid var(--accent); border-radius:8px; padding:.45rem .85rem; }
  .subcontrols button:hover { color:var(--txt); background:rgba(255,255,255,.05); }
  button { background:var(--accent); color:var(--txt); border:none; border-radius:8px; padding:.6rem 1.1rem; font-size:1rem; cursor:pointer; }
  button:hover { background:var(--pop); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:.5rem; justify-content:center; margin-top:.75rem; }
  #encounter { text-align:center; }
  #encounter .emoji { font-size:4rem; }
  #encounter .name { font-size:1.2rem; margin:.25rem 0; }
  #encounter .type { color:var(--muted); font-size:.85rem; }
  #dex { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:.5rem; }
  .critter { background:var(--accent); border-radius:8px; padding:.6rem; text-align:center; }
  .critter .emoji { font-size:1.8rem; }
  .critter .name { font-size:.8rem; margin-top:.2rem; }
  .bar { height:6px; background:#333; border-radius:3px; margin-top:.3rem; overflow:hidden; }
  .bar > i { display:block; height:100%; }
  .hunger > i { background:#e94560; } .energy > i { background:#4ecca3; } .bond > i { background:#f0a500; }
  .actions { display:flex; gap:.25rem; justify-content:center; margin-top:.4rem; }
  .actions button { padding:.25rem .5rem; font-size:.75rem; }
  .empty { color:var(--muted); text-align:center; padding:1rem; }
  .hint { color:var(--muted); font-size:.8rem; text-align:center; margin-top:.5rem; }
  #encounter3d, #viewer-canvas { width:100%; height:200px; border-radius:8px; background:radial-gradient(circle,#1f2b4d,#0d1326); }
  #viewer, #starter { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:10; }
  #viewer-box, #starter-box { background:var(--panel); border-radius:16px; padding:1.25rem; width:min(94vw,520px); text-align:center; }
  #viewer-canvas { height:300px; }
  .starter-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem; margin-top:1rem; }
  .starter { background:var(--accent); border-radius:12px; padding:.75rem .5rem; cursor:pointer; transition:transform .15s; }
  .starter:hover { transform:translateY(-4px); }
  .starter img { margin-bottom:.25rem; }
  .starter button { width:100%; margin-top:.5rem; }
  @media (max-width:480px) { .starter-grid { grid-template-columns:1fr; } }
  #viewer-box .title { font-size:1.1rem; margin:.75rem 0 .25rem; }
  #viewer-box .type { color:var(--muted); font-size:.85rem; margin-bottom:.5rem; }
  #viewer-box button { width:100%; }
  .deximg { width:64px; height:64px; border-radius:8px; background:radial-gradient(circle,#223055,#0d1326); }
  .pokeimg { width:100%; max-height:300px; object-fit:contain; filter:drop-shadow(0 10px 20px rgba(0,0,0,.5)); animation:floaty 2.8s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform:translateY(0) rotate(-1deg); } 50% { transform:translateY(-8px) rotate(1deg); } }
  .tabs { display:flex; gap:.5rem; margin-bottom:.75rem; }
  .tab { padding:.4rem .9rem; font-size:.9rem; border-radius:8px; background:transparent; color:var(--muted); border:1px solid var(--accent); }
  .tab.active { background:var(--accent); color:var(--txt); }
  .dexgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:.85rem; }
  .dexitem { background:var(--accent); border-radius:12px; padding:.85rem .6rem; text-align:center; font-size:.85rem; color:var(--txt); transition:transform .1s; }
  .dexitem:hover { transform:translateY(-3px); }
  .dexitem .img { min-height:3rem; display:flex; align-items:center; justify-content:center; margin-bottom:.5rem; }
  .dexitem .img img { width:3rem; height:3rem; object-fit:contain; }
  .dexitem.locked { opacity:.55; }
  .dexitem .req { font-size:.7rem; color:var(--muted); margin-top:.35rem; line-height:1.4; }
  .dexitem .name { font-size:.9rem; margin-top:.2rem; }
  @media (max-width:400px) { .dexgrid { grid-template-columns:repeat(2,1fr); } }

</style>

</head>
<body>
  <h1>pomodoro<span>-mon</span></h1>

  <div class="card">
    <div id="mode">focus</div>
    <div id="timer">25:00</div>
    <div class="controls">
      <button id="start">Start</button>
      <button id="pause" disabled>Pause</button>
      <button id="reset">Reset</button>
    </div>
    <div class="subcontrols">
      <button id="next">Next session (no points)</button>
      <button id="export">Export save</button>
      <button id="import">Import save</button>
    </div>
    <div id="saved" class="hint" style="margin-top:.25rem"></div>
    <div class="hint">Complete a focus session to encounter a creature.</div>
    <div id="stats" class="hint"></div>
  </div>

  <div id="starter" hidden>
    <div id="starter-box">
      <div class="title">Choose your starter Pok&eacute;mon</div>
      <div class="type">Pick a partner to begin your focus journey</div>
      <div class="starter-grid">
        <div class="starter" onclick="chooseStarter('bulbasaur')">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/1.gif" alt="Bulbasaur" style="image-rendering:pixelated;width:96px;height:96px">
          <div class="name">Bulbasaur</div>
          <div class="req">Grass / Poison</div>
          <button>Pick</button>
        </div>
        <div class="starter" onclick="chooseStarter('charmander')">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/4.gif" alt="Charmander" style="image-rendering:pixelated;width:96px;height:96px">
          <div class="name">Charmander</div>
          <div class="req">Fire</div>
          <button>Pick</button>
        </div>
        <div class="starter" onclick="chooseStarter('squirtle')">
          <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/7.gif" alt="Squirtle" style="image-rendering:pixelated;width:96px;height:96px">
          <div class="name">Squirtle</div>
          <div class="req">Water</div>
          <button>Pick</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" id="encounter-card" hidden>
    <div id="encounter3d"></div>
    <div id="encounter" style="text-align:center"></div>
    <div class="row">
      <button id="catch">Catch</button>
      <button id="flee">Flee</button>
    </div>
  </div>

  <div id="viewer" hidden>
    <div id="viewer-box">
      <div id="viewer-canvas"></div>
      <div class="title" id="viewer-name"></div>
      <div class="type" id="viewer-type"></div>
      <div id="viewer-bars"></div>
      <button id="viewer-close">Close</button>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button id="tab-own" class="tab active">My Creatures</button>
      <button id="tab-dex" class="tab">Dex</button>
    </div>
    <div id="view-own"><div id="dex"></div></div>
    <div id="view-dex" hidden>
      <div class="hint" style="margin-bottom:.6rem">Catch them all. Hidden Pokémon have requirements below.</div>
      <input id="dexsearch" type="search" placeholder="Search…" style="width:100%;padding:.5rem .7rem;border-radius:8px;border:1px solid var(--accent);background:#0d1326;color:var(--txt);margin-bottom:.6rem">
      <div class="dexgrid" id="dexgrid"></div>
    </div>
  </div>

<script src="creatures.js?v=1"></script>
<script>
// ponytail: personal-use Pokémon branch — official artwork via PokéAPI sprites repo (no key);
// original creatures preserved in `original-creatures` branch for public deploy
const byId = id => CREATURES.find(c => c.id === id);
// official-artwork PNG by national dex number (PokéAPI sprites repo)
const art = c => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${c.pid}.png`;
// animated Gen-5-style sprite (idle motion); exists for pid ≤ 649 — we only ship 1–251
const anim = c => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${c.pid}.gif`;
const typeStr = c => (c.types ? c.types.join('/') : c.type); // compat: generated data uses types[]
const reqMet = (c) => !c.req || ( (c.req.minStreak||0) <= state.streak && (c.req.minSessions||0) <= state.sessionsDone );
const reqText = (c) => !c.req ? 'None' : [c.req.minStreak ? `Streak ≥ ${c.req.minStreak}d` : null, c.req.minSessions ? `Total ≥ ${c.req.minSessions}` : null].filter(Boolean).join(' · ');

const FOCUS_MIN = 25, BREAK_MIN = 5, LONG_BREAK_MIN = 15;
const SAVE_KEY = 'pomodoro-mon-v2-pokemon'; // ponytail: new key = fresh save; old-creature saves would break dex lookups
const TICK_MS = 1000;
// ponytail: decay per minute of real time; modest so neglect isn't punishing
const DECAY_PER_MIN = { hunger:2, energy:1, bond:0.5 };
// ponytail: status durations/effects per second — makes creature care dynamic over real time (long durations so it doesn't demand constant clicks)
const STATUS = {
  eating:  { sec:300, hunger:0.34 },     // ~5 min, restores full hunger
  playing: { sec:600, bond:0.17, energy:-0.12 }, // ~10 min, maxes bond
  sleeping:{ sec:7200, energy:0.03, hunger:-0.005 }, // ~2 hours, full energy recovery
};
const ESCAPE_MS = 72 * 60 * 60 * 1000; // ponytail: creature flees if hunger stays at 0 for 72h

const $ = id => document.getElementById(id);
const todayKey = () => new Date().toISOString().slice(0,10);
const state = {
  mode:'focus', remaining:FOCUS_MIN*60, running:false, interval:null,
  encounter:null, dex:[], lastSeen:Date.now(), berries:0,
  sessionsDone:0, lastSessionDay:null, streak:0, todayCount:0, cycleCount:0,
  viewMode:'anim', // viewer image mode: 'anim' (sprite) or 'art' (official artwork)
  statusLoop:null,
};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s) {
      // ponytail: persist timer progress across reloads, but reset cycleCount so you don't jump to long break after one session
      const mode = ['focus','break','longbreak'].includes(s.mode) ? s.mode : 'focus';
      const full = mode==='break'?BREAK_MIN*60 : mode==='longbreak'?LONG_BREAK_MIN*60 : FOCUS_MIN*60;
      const remaining = typeof s.remaining==='number' && s.remaining > 0 ? s.remaining : full;
      Object.assign(state, s, { running:false, interval:null, encounter:null, mode, remaining, cycleCount:0 });
      // ponytail: migrate old saves — drop dex entries missing pid (old schema) so anim()/art() never produce undefined.gif
      state.dex = (state.dex||[]).filter(c => c.pid && byId(c.id));
      state.savedAt = s.savedAt || null;
      // ponytail: repair saves corrupted by the old always-on self-check (last write had mode:'break', remaining:300)
      if (mode === 'break' && remaining === BREAK_MIN*60 && !s.userVerifiedBreak) {
        state.mode = 'focus'; state.remaining = FOCUS_MIN*60;
      }
    }
  } catch {}
  applyDecay();
  // ponytail: resume real-time status loop if any creature is busy after load
  if (state.dex.some(c => c.status)) startStatusLoop();
  render();
}
function save() {
  const { running, interval, encounter, statusLoop, ...rest } = state;
  rest.savedAt = Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(rest));
}

function applyDecay() {
  const now = Date.now();
  const mins = (now - (state.lastSeen||now)) / 60000;
  const secs = (now - (state.lastSeen||now)) / 1000;
  if (mins > 0 && state.dex.length) {
    const escaped = [];
    state.dex.forEach(c => {
      c.hunger = clamp(c.hunger - DECAY_PER_MIN.hunger * mins);
      c.energy = clamp(c.energy - DECAY_PER_MIN.energy * mins);
      c.bond   = clamp(c.bond   - DECAY_PER_MIN.bond   * mins);
      // ponytail: resolve offline statuses — apply their effects for elapsed time up to status expiry
      if (c.status && c.statusUntil > state.lastSeen) {
        const activeSecs = Math.min(secs, (c.statusUntil - state.lastSeen) / 1000);
        applyStatusEffects(c, activeSecs);
        maybeEvolve(c);
        if (now >= c.statusUntil) c.status = null;
      }
      // ponytail: neglect escape — hunger hits 0 and stays there for 24h
      if (c.hunger <= 0) { if (!c.neglectSince) c.neglectSince = now; }
      else { c.neglectSince = null; }
      if (c.neglectSince && now - c.neglectSince > ESCAPE_MS) escaped.push(c);
    });
    if (escaped.length) {
      escaped.forEach(c => notify('A Pokémon fled', `${c.name} left because hunger hit zero for too long.`));
      state.dex = state.dex.filter(c => !escaped.includes(c));
    }
  }
  state.lastSeen = now;
}
function applyStatusEffects(c, secs) {
  const s = c.status && STATUS[c.status];
  if (!s) return;
  if (s.hunger)  c.hunger = clamp(c.hunger + s.hunger * secs);
  if (s.energy)  c.energy = clamp(c.energy + s.energy * secs);
  if (s.bond)    c.bond   = clamp(c.bond   + s.bond   * secs);
}
// ponytail: real-time status loop — runs only while any creature is busy
function processStatuses() {
  const now = Date.now();
  let busy = false;
  state.dex.forEach(c => {
    if (!c.status) return;
    if (now >= c.statusUntil) { c.status = null; return; }
    applyStatusEffects(c, 1);
    maybeEvolve(c);
    busy = true;
  });
  if (busy) { render(); save(); }
  if (!busy && state.statusLoop) { clearInterval(state.statusLoop); state.statusLoop = null; }
}
function startStatusLoop() {
  if (state.statusLoop) return;
  state.statusLoop = setInterval(processStatuses, 1000);
}
const clamp = (v, lo=0, hi=100) => Math.max(lo, Math.min(hi, v));

function fmt(s) { const m=Math.floor(s/60), x=s%60; return `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; }

function tick() {
  state.remaining -= 1;
  if (state.remaining <= 0) { finishSession(); render(); } // ponytail: render after session transition too — was leaving UI frozen at 00:01
  else { render(); save(); } // ponytail: save each second so reload resumes at current time
}
function finishSession() {
  clearInterval(state.interval); state.running=false;
  if (state.mode === 'focus') {
    state.berries += 1;
    state.sessionsDone += 1;
    // streak: consecutive days with >=1 focus session
    const t = todayKey();
    if (state.lastSessionDay !== t) {
      const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
      state.streak = (state.lastSessionDay === y) ? state.streak+1 : 1;
      state.lastSessionDay = t;
      state.todayCount = 0;
    }
    state.todayCount += 1;
    spawnEncounter();
    notify('Focus done!', state.encounter ? `${state.encounter.name} appeared!` : 'Take a break.');
    state.cycleCount += 1;
    if (state.cycleCount >= 4) {
      state.cycleCount = 0;
      state.mode = 'longbreak'; state.remaining = LONG_BREAK_MIN*60;
      notify('Set complete!', 'Enjoy a 15-minute long break.');
    } else {
      state.mode = 'break'; state.remaining = BREAK_MIN*60;
    }
  } else {
    notify('Break over', 'Back to focus.');
    state.mode = 'focus'; state.remaining = FOCUS_MIN*60;
  }
  save();
}
// ponytail: WebAudio beep, no asset file; notification needs permission, degrades silently
function notify(title, body) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; o.type='sine';
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.5);
    o.start(); o.stop(ctx.currentTime+0.5);
  } catch {}
  if ('Notification' in window && Notification.permission==='granted') {
    try { new Notification(title, { body }); } catch {}
  }
}
function spawnEncounter() {
  // ponytail: weighted by rarity (lower=common); streak ≥3 today boosts rare odds; req-gated creatures filtered
  const boost = state.todayCount >= 3 ? 2 : 1;
  const pool = CREATURES.filter(c => c.rarity > 0 && reqMet(c));
  if (!pool.length) return;
  const weighted = pool.flatMap(c => Array(c.rarity === 3 ? 3*boost : c.rarity).fill(c));
  state.encounter = weighted[Math.floor(Math.random()*weighted.length)];
}

function start() {
  if(state.running)return;
  if ('Notification' in window && Notification.permission==='default') Notification.requestPermission();
  state.running=true; state.interval=setInterval(tick,TICK_MS); render();
}
function pause() { if(!state.running)return; state.running=false; clearInterval(state.interval); render(); }
function reset() { pause(); state.remaining=(state.mode==='break'?BREAK_MIN:state.mode==='longbreak'?LONG_BREAK_MIN:FOCUS_MIN)*60; render(); save(); }
// ponytail: skip-forward through session types, no points/encounters — useful for testing/short days
function nextSession() {
  pause();
  state.encounter = null;
  if (state.mode === 'focus') {
    state.cycleCount += 1;
    if (state.cycleCount >= 4) { state.cycleCount = 0; state.mode = 'longbreak'; }
    else { state.mode = 'break'; }
  } else {
    state.mode = 'focus';
  }
  state.remaining = (state.mode==='break'?BREAK_MIN:state.mode==='longbreak'?LONG_BREAK_MIN:FOCUS_MIN)*60;
  render(); save();
}

function catchEncounter() {
  if (!state.encounter) return;
  const c = state.encounter;
  const existing = state.dex.find(d => d.id === c.id);
  if (existing) {
    // duplicate: reward berries + bond instead of blocking
    state.berries += 2;
    existing.bond = clamp(existing.bond + 15);
    maybeEvolve(existing);
  } else {
    state.dex.push({ id:c.id, pid:c.pid, name:c.name, hunger:80, energy:80, bond:20 });
  }
  state.encounter = null;
  save(); render();
}
function flee() { state.encounter = null; render(); }

function feed(c) {
  if (state.berries<=0 || c.status) return;
  state.berries-=1; c.status='eating'; c.statusUntil=Date.now()+STATUS.eating.sec*1000;
  startStatusLoop(); save(); render();
}
function rest(c) {
  if (c.status) return;
  c.status='sleeping'; c.statusUntil=Date.now()+STATUS.sleeping.sec*1000;
  startStatusLoop(); save(); render();
}
function play(c) {
  if (c.energy < 15 || c.status) return;
  c.status='playing'; c.statusUntil=Date.now()+STATUS.playing.sec*1000;
  startStatusLoop(); save(); render();
}
// end a status early (optional cancel button)
function cancelStatus(c) {
  if (!c.status) return;
  c.status = null; c.statusUntil = null;
  if (state.statusLoop) { clearInterval(state.statusLoop); state.statusLoop = null; }
  render(); save();
}
// ponytail: evolve at bond>=100; replaces in-place with evolved form, keeps stats
function maybeEvolve(c) {
  if (c.bond < 100) return;
  const base = byId(c.id);
  if (!base || !base.evolvesTo) return;
  const evo = byId(base.evolvesTo);
  if (!evo) return;
  c.id = evo.id; c.pid = evo.pid; c.name = evo.name;
  c.bond = 100; // cap, evolved forms don't decay-bond past max
  notify('Evolution!', `${evo.name} evolved from ${base.name}.`);
}

function render() {
  $('timer').textContent = fmt(Math.max(0,state.remaining));
  $('mode').textContent = state.mode;
  $('start').disabled = state.running;
  $('pause').disabled = !state.running;
  $('stats').textContent = `Today: ${state.todayCount} · Streak: ${state.streak}d · Berries: ${state.berries} · Total: ${state.sessionsDone} · Set: ${state.cycleCount}/4`;

  const modeLabel = state.mode === 'longbreak' ? 'long break' : state.mode;
  const ec = $('encounter-card');
  if (state.encounter) {
    ec.hidden = false;
    $('encounter').innerHTML = `<div class="name">${state.encounter.name}</div><div class="type">${typeStr(state.encounter)} · rarity ${'★'.repeat(state.encounter.rarity)}</div>`;
    const em = byId(state.encounter.id) || state.encounter;
    $('encounter3d').innerHTML = `<img src="${anim(em)}" alt="${em.name}" style="image-rendering:pixelated;height:110px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4))">`;
  } else { ec.hidden = true; }

  const dex = $('dex');
  if (!state.dex.length) {
    dex.innerHTML = `<div class="empty">No creatures yet. Complete a focus session!</div>`;
  } else {
    dex.innerHTML = state.dex.map((c,i)=>{
      const hearts = '❤️'.repeat(Math.floor(c.bond/25)) + '🤍'.repeat(4 - Math.floor(c.bond/25));
      const tired = c.energy < 15 ? '<div class="hint" style="font-size:.7rem">Tired — rest first</div>' : '';
      const statusLabel = c.status ? `<div style="font-size:.7rem;color:var(--pop);text-transform:capitalize">${c.status}… ${Math.ceil((c.statusUntil-Date.now())/1000)}s</div>` : '';
      const btn = (icon, fn, title, disabled) => `<button onclick="${fn}(state.dex[${i}])" title="${title}" ${disabled ? 'disabled' : ''}>${icon}</button>`;
      const busy = !!c.status;
      const cancel = busy ? `<button onclick="cancelStatus(state.dex[${i}])" title="Cancel" style="font-size:.6rem">✕</button>` : '';
      return `
      <div class="critter" onclick="openViewer(${i})" style="cursor:pointer" title="View">
        <img class="deximg" src="${anim(byId(c.id)||c)}" alt="${c.name}" loading="lazy" style="image-rendering:pixelated;background:none;box-shadow:none">
        <div class="name">${c.name}</div>
        ${c.bond >= 100 ? '<div style="font-size:.65rem;color:var(--pop)">MAX — can evolve</div>' : ''}
        ${statusLabel}
        <div class="bar hunger"><i style="width:${c.hunger}%"></i></div>
        <div class="bar energy"><i style="width:${c.energy}%"></i></div>
        <div class="bar bond"><i style="width:${c.bond}%"></i></div>
        <div style="font-size:.65rem;margin-top:.2rem">${hearts} ${c.bond}</div>
        ${tired}
        <div class="actions" onclick="event.stopPropagation()">
          ${busy ? btn('🍎','feed','Already busy',true) : btn('🍎','feed','Feed (1 berry)',state.berries<=0)}
          ${busy ? btn('💤','rest','Already busy',true) : btn('💤','rest','Rest')}
          ${busy ? btn('🎾','play','Already busy',true) : btn('🎾','play','Play (needs energy)',c.energy<15)}
          ${cancel}
        </div>
      </div>`;
    }).join('');
  }
  renderDexGrid();
  $('start').textContent = state.remaining===((state.mode==='break'?BREAK_MIN:state.mode==='longbreak'?LONG_BREAK_MIN:FOCUS_MIN)*60) && !state.running ? 'Start' : (state.running?'Running…':'Resume');
  const when = state.savedAt ? new Date(state.savedAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : 'never';
  $('saved').textContent = `Saved: ${when}`;
  document.title = `${fmt(state.remaining)} · ${modeLabel} · pomodoro-mon`;
  $('starter').hidden = state.dex.length > 0;
}

function chooseStarter(id) {
  const c = byId(id);
  if (!c) return;
  state.dex.push({ id:c.id, pid:c.pid, name:c.name, hunger:80, energy:80, bond:40 });
  state.berries = 5;
  save(); render();
  notify('Starter chosen!', `${c.name} is ready to focus with you.`);
}
window.chooseStarter = chooseStarter;
window.cancelStatus = cancelStatus;

function exportSave() {
  const data = localStorage.getItem(SAVE_KEY);
  if (!data) return;
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pomodoro-mon-save.json';
  a.click();
  notify('Save exported', 'Keep the .json file safe.');
}
function importSave() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        localStorage.setItem(SAVE_KEY, ev.target.result);
        load();
        notify('Save imported', 'Progress restored.');
      } catch (err) { notify('Import failed', err.message); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ponytail: dex tab — all 16 creatures, silhouette when unknown, requirement + owned state when known
function renderDexGrid() {
  const q = ($('dexsearch')?.value || '').toLowerCase();
  const ownedIds = new Set(state.dex.map(c => c.id));
  const baseIds = new Set(state.dex.map(c => CREATURES.find(x => x.id === c.id && x.evolvesTo)?.evolvesTo).filter(Boolean));
  const list = q ? CREATURES.filter(c => c.name.toLowerCase().includes(q)) : CREATURES;
  $('dexgrid').innerHTML = list.map(c => {
    const owned = ownedIds.has(c.id) || baseIds.has(c.id);
    if (!owned) {
      const hint = c.req ? reqText(c) : 'Focus sessions to find';
      return `<div class="dexitem locked"><div class="img">❓</div><div class="name">???</div><div class="req" title="Requirement">${hint}</div></div>`;
    }
    return `<div class="dexitem" onclick="openDexViewer('${c.id}')" style="cursor:pointer" title="View"><div class="img"><img src="${anim(c)}" alt="${c.name}" loading="lazy" style="image-rendering:pixelated"></div><div class="name">${c.name}</div><div class="req">${typeStr(c)} · ${'★'.repeat(c.rarity)||'★'}</div></div>`;
  }).join('');
}
function openDexViewer(id) {
  const c = byId(id); if (!c) return;
  showViewer(c, null);
}
function openViewer(i) {
  const c = state.dex[i];
  if (!c) return;
  const em = byId(c.id) || c;
  showViewer(em, c);
}
function showViewer(c, owned) {
  $('viewer').hidden = false;
  $('viewer-name').textContent = c.name;
  const status = owned && owned.status ? `${owned.status}… ${Math.ceil((owned.statusUntil - Date.now())/1000)}s` : '';
  const info = owned ? `${typeStr(c)} · bond ${owned.bond}${status ? ' · ' + status : ''}${owned.energy < 15 ? ' · tired' : ''}` : `${typeStr(c)} · ${c.evolvesTo ? 'Evolves into ' + byId(c.evolvesTo).name : 'Final form'}`;
  $('viewer-type').textContent = info;
  const img = state.viewMode === 'anim'
    ? `<img src="${anim(c)}" alt="${c.name}" style="image-rendering:pixelated;max-height:260px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))">`
    : `<img class="pokeimg" src="${art(c)}" alt="${c.name}">`;
  $('viewer-canvas').innerHTML = img + `<button onclick="toggleViewMode()" style="margin-top:.5rem;background:transparent;color:var(--muted);border:1px solid var(--accent);font-size:.75rem;border-radius:6px;padding:.3rem .7rem">${state.viewMode==='anim'?'Show artwork':'Show sprite'}</button>`;
}
function toggleViewMode() { state.viewMode = state.viewMode === 'anim' ? 'art' : 'anim'; render(); }
window.openDexViewer = openDexViewer;
window.toggleViewMode = toggleViewMode;

$('start').onclick = start;
$('pause').onclick = pause;
$('reset').onclick = reset;
$('next').onclick = nextSession;
$('export').onclick = exportSave;
$('import').onclick = importSave;
$('catch').onclick = catchEncounter;
$('flee').onclick = flee;
$('viewer-close').onclick = () => $('viewer').hidden = true;
$('viewer').onclick = e => { if (e.target.id === 'viewer') $('viewer').hidden = true; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('viewer').hidden = true; });
window.addEventListener('beforeunload', save); // extra safety for tab-close while paused
window.addEventListener('pagehide', save);    // mobile Safari doesn't always fire beforeunload
function switchTab(tab) {
  $('view-own').hidden = tab !== 'own';
  $('view-dex').hidden = tab !== 'dex';
  $('tab-own').classList.toggle('active', tab === 'own');
  $('tab-dex').classList.toggle('active', tab === 'dex');
}
$('tab-own').onclick = () => switchTab('own');
$('tab-dex').onclick = () => switchTab('dex');
$('dexsearch').oninput = renderDexGrid;
window.feed = feed; window.rest = rest; window.play = play;
window.openViewer = openViewer; // expose for inline onclick
function openViewer(i) {
  const c = state.dex[i];
  if (!c) return;
  $('viewer').hidden = false;
  $('viewer-name').textContent = c.name;
  $('viewer-type').textContent = `${typeStr(byId(c.id)||c)} · bond ${c.bond}${c.energy < 15 ? ' · tired' : ''}`;
  const em = byId(c.id) || c;
  $('viewer-canvas').innerHTML = `<img class="pokeimg" src="${art(em)}" alt="${em.name}">`;
}

// ponytail: self-check — runs ONLY locally or with ?debug=1, failing loud if logic breaks
// It mutates state + calls save(), so it must never run on the live site
const DEBUG_SELF_CHECK = location.hostname === 'localhost' || new URLSearchParams(location.search).has('debug');
if (DEBUG_SELF_CHECK) (function check() {
  console.assert(clamp(120)===100, 'clamp caps at 100');
  console.assert(clamp(-5)===0, 'clamp floors at 0');
  // weighted spawn: rarity 1 should appear more than rarity 3 over many pulls
  const counts = {};
  for (let i=0;i<3000;i++) {
    state.encounter = null;
    spawnEncounter();
    if (state.encounter) counts[state.encounter.id] = (counts[state.encounter.id]||0)+1;
  }
  console.assert(counts['bulbasaur'] > 0, 'common creatures spawn');
  console.assert(counts['mewtwo'] == null, 'gated legendaries hidden until requirements met');
  // rarity weighting: common (rarity 1) should outnumber uncapped rares (rarity 3) among spawnable pool
  const spawnable = CREATURES.filter(c => c.rarity > 0 && reqMet(c));
  const commons = Object.entries(counts).filter(([id]) => spawnable.find(c => c.id === id)?.rarity === 1).reduce((a,[,n]) => a+n, 0);
  const rares   = Object.entries(counts).filter(([id]) => spawnable.find(c => c.id === id)?.rarity === 3).reduce((a,[,n]) => a+n, 0);
  console.assert(commons > rares, 'weighted spawn favors commons');
  // decay over 60 min: hunger drops ~120 but clamps to 0
  state.dex = [{ id:'bulbasaur', pid:1, name:'Bulbasaur', hunger:100, energy:100, bond:100 }];
  state.lastSeen = Date.now() - 60*60*1000;
  applyDecay();
  console.assert(state.dex[0].hunger===0, 'decay clamps at 0');
  // evolution: bond>=100 + has evolvesTo → transforms in place
  state.dex = [{ id:'bulbasaur', pid:1, name:'Bulbasaur', hunger:80, energy:80, bond:100 }];
  maybeEvolve(state.dex[0]);
  console.assert(state.dex[0].id==='ivysaur', 'evolution transforms creature');
  console.assert(state.dex[0].pid===2, 'evolution updates pid');
  // pomodoro cycle: 4 focus sessions → long break, then cycle resets on break end
  state.mode = 'focus'; state.remaining = 0; state.cycleCount = 0;
  function simFocusEnd() { state.remaining = 0; finishSession(); }
  for (let i=0;i<4;i++) simFocusEnd();
  console.assert(state.mode==='longbreak', '4th focus triggers long break');
  console.assert(state.cycleCount===0, 'cycle resets at long break');
  state.remaining = 0; finishSession();
  console.assert(state.mode==='focus', 'after long break back to focus');
  console.log('pomodoro-mon self-check: OK');
})();

load();
</script>
